<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapTec · TJRR</title>
<meta name="description" content="MapTec: encontre salas, setores e unidades do Tribunal de Justiça do Estado de Roraima.">
<meta name="theme-color" content="#0a2c63">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo-tjrr-azul.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
    --navy: #0a2c63;
    --navy-2: #0d3a80;
    --blue: #0b4fb0;
    --blue-soft: #e8f0fb;
    --blue-line: #cfe0f6;
    --bg: #f3f6fb;
    --card: #ffffff;
    --text: #14233d;
    --muted: #4a5b75;
    --line: #dfe6f1;
    --accent: #e08300;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(10, 44, 99, .08);
    --shadow-lg: 0 10px 30px rgba(10, 44, 99, .16);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid #f2a33a; outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: #fff; color: var(--navy); padding: 8px 14px; border-radius: 8px; z-index: 5000; }
.skip:focus { left: 8px; }
.ico { flex-shrink: 0; vertical-align: middle; }
.hidden { display: none !important; }
.container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* ===== Topbar ===== */
.topbar { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
.topbar .container { display: flex; align-items: center; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff; min-width: 0; }
.brand-logo { height: 50px; width: auto; flex-shrink: 0; display: block; }
.brand-sep { width: 1px; height: 34px; background: rgba(255,255,255,.35); }
.brand-name { font-size: 1.3rem; font-weight: 700; line-height: 1.15; letter-spacing: .2px; }
.brand-sub { font-size: .82rem; color: rgba(255,255,255,.82); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.top-btn { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: #fff; border: 0; border-radius: 10px; padding: 10px 12px; min-height: 44px; font-size: .9rem; cursor: pointer; text-decoration: none; }
.top-btn:hover { background: rgba(255,255,255,.12); }

.banner { background: #fff4e0; color: #7a4a00; border-bottom: 1px solid #f3d9a8; font-size: .88rem; }
.banner .container { padding-top: 9px; padding-bottom: 9px; display: flex; gap: 8px; align-items: center; }

/* ===== Hero ===== */
.hero {
    background-color: #eaf2fd;
    background-image: linear-gradient(90deg, #f1f6fe 0%, #f1f6fe 38%, rgba(241,246,254,.55) 62%, rgba(241,246,254,.1) 100%), var(--hero-img);
    background-size: cover; background-position: right center;
    border-bottom: 1px solid var(--line);
}
.hero .container { padding-top: 44px; padding-bottom: 44px; }
.hero h1 { margin: 0 0 10px; font-size: clamp(1.7rem, 4.6vw, 2.5rem); line-height: 1.12; color: var(--navy); max-width: 560px; letter-spacing: -.3px; }
.hero p { margin: 0 0 26px; max-width: 520px; color: var(--muted); font-size: 1.02rem; }
.searchbar { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--blue-line); border-radius: 16px; padding: 8px 8px 8px 16px; max-width: 760px; box-shadow: var(--shadow-lg); color: var(--blue); }
.searchbar:focus-within { border-color: var(--blue); }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1.05rem; color: var(--text); padding: 12px 4px; font-family: inherit; }
.searchbar input::placeholder { color: #7a8aa3; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 0 22px; min-height: 48px; font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: none; transition: background .15s, transform .1s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--navy-2); }
.btn-soft { background: var(--blue-soft); color: var(--navy); border: 1px solid var(--blue-line); }
.btn-soft:hover { background: #dce9fa; }

/* ===== Section / building cards ===== */
.section-title { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; margin: 30px 0 16px; color: var(--navy); }
.building-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); }
.b-card { display: block; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; animation: rise .35s ease both; }
.b-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.b-card img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--blue-soft); }
.b-body { padding: 14px 16px 16px; position: relative; }
.b-name { margin: 0 0 4px; font-size: 1.05rem; color: var(--text); }
.b-meta { display: flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--muted); margin-top: 3px; }
.b-go { position: absolute; right: 14px; top: -18px; box-shadow: 0 2px 8px rgba(10,44,99,.3); border: 2px solid #fff; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ===== Search results ===== */
.res-count { font-size: .9rem; color: var(--muted); margin: 26px 2px 12px; }
.res-list { display: grid; gap: 10px; }
.res { display: grid; grid-template-columns: 78px 1fr auto; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; text-decoration: none; box-shadow: var(--shadow); }
.res:hover { border-color: var(--blue); }
.res-num { background: var(--blue-soft); color: var(--navy); font-weight: 800; font-size: 1.15rem; text-align: center; border-radius: 10px; padding: 12px 6px; }
.res.no-num { grid-template-columns: 1fr auto; }
.res-name { font-weight: 700; font-size: 1rem; }
.res-loc { color: var(--muted); font-size: .86rem; margin-top: 2px; }
.res-code { background: var(--navy); color: #fff; font-weight: 700; font-size: .9rem; border-radius: 8px; padding: 6px 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
mark { background: #ffe9a8; color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty strong { display: block; font-size: 1.1rem; color: var(--text); margin-bottom: 6px; }

/* ===== Building page ===== */
.crumbs { display: flex; align-items: center; gap: 6px; font-size: .9rem; padding: 16px 0 12px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { color: var(--blue); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.layout > * { min-width: 0; }
.layout { display: grid; gap: 22px; grid-template-columns: 1fr; padding-bottom: 20px; }
@media (min-width: 900px) { .layout { grid-template-columns: 290px 1fr; align-items: start; } }
.side { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
@media (min-width: 900px) { .side { position: sticky; top: 84px; } }
.side img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.side-body { padding: 16px; }
.side h1 { margin: 0 0 2px; font-size: 1.25rem; color: var(--navy); }
.side .sub { color: var(--muted); font-size: .88rem; margin-bottom: 10px; }
.addr { font-size: .88rem; color: var(--text); display: flex; gap: 8px; margin: 10px 0 14px; }
.addr .ico { color: var(--blue); margin-top: 2px; }
.side .btn { width: 100%; min-height: 44px; font-size: .9rem; }
.side-count { font-size: .85rem; color: var(--muted); margin: 12px 0 0; text-align: center; }
.floors-title { margin: 18px 0 8px; font-size: .95rem; color: var(--navy); }
.floors { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
@media (min-width: 900px) { .floors { flex-direction: column; overflow: visible; max-height: 52vh; overflow-y: auto; } }
.floor { display: flex; align-items: center; gap: 10px; text-decoration: none; white-space: nowrap; background: var(--blue-soft); color: var(--navy); border: 1px solid var(--blue-line); border-radius: 10px; padding: 0 14px; min-height: 44px; font-weight: 600; font-size: .92rem; transition: background .15s; }
.floor:hover { background: #dce9fa; }
.floor[aria-current="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.floor .n { margin-left: auto; font-size: .78rem; font-weight: 700; opacity: .8; padding-left: 8px; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-height: 300px; }
.panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.panel-head .ico-wrap { color: var(--blue); }
.panel-head h2 { margin: 0; font-size: 1.4rem; color: var(--navy); }
.panel-head p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.tools { display: flex; gap: 10px; margin-bottom: 16px; }
.field { flex: 1; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--blue-line); border-radius: 12px; padding: 0 12px; background: #fff; color: var(--blue); }
.field:focus-within { border-color: var(--blue); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 1rem; padding: 12px 2px; background: transparent; font-family: inherit; color: var(--text); }
.view-toggle { display: flex; border: 1.5px solid var(--blue-line); border-radius: 12px; overflow: hidden; }
.view-toggle button { background: #fff; border: 0; width: 46px; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.view-toggle button[aria-pressed="true"] { background: var(--blue); color: #fff; }

.rooms.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.room { display: flex; flex-direction: column; gap: 6px; text-decoration: none; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; min-height: 104px; transition: border-color .15s, box-shadow .15s, transform .12s; animation: rise .3s ease both; }
.room:hover { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-2px); }
.room-num { font-size: 1.35rem; font-weight: 800; color: var(--navy); line-height: 1; }
.room:not(:has(.room-num)) .room-name { font-size: .95rem; color: var(--text); font-weight: 600; }
.room-name { overflow-wrap: anywhere; font-size: .8rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.room-code { margin-top: auto; align-self: flex-start; background: var(--blue-soft); color: var(--navy); font-weight: 700; font-size: .78rem; border-radius: 6px; padding: 2px 8px;  display: inline-flex; align-items: center; gap: 5px; }
.room-floor { font-size: .72rem; color: var(--blue); font-weight: 700; }
.rooms.list { display: grid; gap: 8px; }
.rooms.list .room { flex-direction: row; align-items: center; gap: 14px; min-height: 0; padding: 10px 14px; }
.rooms.list .room-num { min-width: 64px; font-size: 1.1rem; }
.rooms.list .room-name { flex: 1; font-size: .92rem; color: var(--text); -webkit-line-clamp: 2; }
.rooms.list .room-code { margin: 0; }

/* ===== Modal ===== */
.overlay { position: fixed; inset: 0; background: rgba(8, 24, 54, .55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 3000; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px; box-shadow: var(--shadow-lg); padding: 26px; position: relative; animation: pop .22s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.modal-x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.modal-x:hover { background: var(--blue-soft); }
.m-head { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; padding-right: 40px; }
.m-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.m-head h2 { margin: 0; font-size: 1.6rem; color: var(--text); line-height: 1.15; }
.m-row { display: flex; gap: 12px; align-items: flex-start; font-size: 1.02rem; margin: 12px 0; }
.m-row .ico { color: var(--navy); margin-top: 2px; }
.m-code { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--blue-soft); border: 1px solid var(--blue-line); border-radius: 12px; padding: 12px 16px; margin: 16px 0; }
.m-code small { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.m-code strong { display: inline-flex; align-items: center; gap: 10px; font-size: 1.9rem; color: var(--navy); line-height: 1.1; }
.m-nocode { background: #f4f6fa; border-radius: 12px; padding: 12px 16px; margin: 16px 0; color: var(--muted); font-style: italic; }
.m-obs { display: flex; gap: 10px; background: var(--blue-soft); border-radius: 10px; padding: 12px 14px; color: var(--navy); margin: 12px 0; }
.m-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 20px; }
.about-list { display: grid; gap: 14px; margin: 18px 0 4px; }
.about-item { display: flex; gap: 14px; align-items: flex-start; }
.about-item .circ { width: 44px; height: 44px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.about-item strong { display: block; color: var(--navy); }
.about-item span { color: var(--muted); font-size: .9rem; }

/* ===== Footer / toast ===== */
.footer { background: var(--navy); color: rgba(255,255,255,.88); margin-top: 36px; font-size: .88rem; }
.footer .container { padding-top: 24px; padding-bottom: 28px; display: grid; gap: 4px; }
.footer strong { color: #fff; font-size: 1rem; }
.footer a { color: #fff; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #14233d; color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 4000; box-shadow: var(--shadow-lg); font-size: .92rem; }

@media (max-width: 640px) {
    .container { padding: 0 14px; }
    .brand-name { font-size: 1.1rem; }
    .brand-logo { height: 42px; }
    .brand-sep, .top-btn span { display: none; }
    .hero .container { padding-top: 28px; padding-bottom: 30px; }
    .hero { background-image: linear-gradient(180deg, #f1f6fe 0%, rgba(241,246,254,.9) 55%, rgba(241,246,254,.6) 100%), var(--hero-img); }
    .searchbar { padding-left: 12px; }
    .searchbar .btn span { display: none; }
    .searchbar .btn { padding: 0 16px; }
    .panel { padding: 14px; }
    .modal { padding: 20px; }
    .m-head h2 { font-size: 1.35rem; }
    .res { grid-template-columns: 60px 1fr; }
    .res-code { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

    <div class="container">
        <a class="brand" href="#/" aria-label="MapTec · TJRR — página inicial">
            <img class="brand-logo" id="logo" alt="Poder Judiciário do Estado de Roraima" src="assets/logo-tjrr-branco.png" width="78" height="50">

<script>
// ============================================================
// CONFIG
// ============================================================
const REPO = 'Rafajames/MapTec-TJRR';
const DATA_URL = 'data/maptec.json';
const CACHE_DATA = 'maptec_data_cache_v3';
const CACHE_DATE = 'maptec_updated_v3';

// ============================================================
// ÍCONES
// ============================================================
const ICONS = {
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    building: '<path d="M3 21h18M5 21V5a1 1 0 011-1h8a1 1 0 011 1v16M15 9h3a1 1 0 011 1v11M9 8h2M9 12h2M9 16h2"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    door: '<path d="M6 21V4a1 1 0 011-1h10a1 1 0 011 1v17M3 21h18"/><circle cx="14.5" cy="12.5" r=".8" fill="currentColor"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 011-1h10"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    grid: '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    wifi: '<path d="M2 8.8a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/>',
    phone: '<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 011.7 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/>',
    check: '<path d="M20 6L9 17l-5-5"/>'
};
function ico(name, size) {
    size = size || 20;
    return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

// ============================================================
// TEXTO / BUSCA
// ============================================================
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SIGLAS = new Set(['CPS','SEC','SAD','GMF','TIC','TI','NPI','SIL','DML','OAB','TRE','STI','DPE','MPE','CIJ','CEJAI','CEJUSC','CRSF','DGEX','CEAVCAI','NATJUS','NUPEMEC','PROCON','QGBT','SALC','SINFRA','NAT','JUS','TJRR','CNJ']);
const MINUSC = new Set(['de','da','do','das','dos','e','em','no','na','nos','nas','para','com','ao']);
const ACENTOS = { ANALISE:'análise', ATENCIMENTO:'atendimento', AUDIENCIAS:'audiências', INFORMACAO:'informação', INFORMATICA:'informática', JURIDICA:'jurídica', LOGISTICA:'logística', NUCLEO:'núcleo', PRECATORIOS:'precatórios', PRECENDENTES:'precedentes', PRESIDENCIA:'presidência', REUNIAO:'reunião', SINDICANCIA:'sindicância', TECNICA:'técnica' };

// Só formata na EXIBIÇÃO; o JSON mantém o texto original.
function fmtNome(s) {
    s = String(s || '');
    const letras = s.replace(/[^A-Za-zÀ-ú]/g, '');
    const ups = letras.replace(/[^A-ZÀ-Ú]/g, '').length;
    s = s.replace(/,\//g, '/').replace(/_/g, ' – ');
    if (!letras || ups / letras.length < 0.6) return s.trim();
    let first = true;
    return s.replace(/[A-Za-zÀ-ú0-9ºª]+/g, w => {
        const wasFirst = first; first = false;
        if (SIGLAS.has(w)) return w;
        if (/\d/.test(w) && /[A-Z]/.test(w)) return w;
        const low = ACENTOS[w] || w.toLowerCase();
        if (!wasFirst && MINUSC.has(low)) return low;
        return low.charAt(0).toUpperCase() + low.slice(1);
    }).trim();
}
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const slugify = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
// Números sem zeros à esquerda: "001", "01" e "1" são equivalentes.
const semZeros = s => s.replace(/^0+(?=\d)/, '');
function tokens(q) { return norm(q).split(/\s+/).filter(Boolean).map(semZeros); }
function matches(hay, q) { return tokens(q).every(t => hay.includes(t)); }
function highlight(text, q) {
    const tk = tokens(q), n = norm(text);
    if (!tk.length || n.length !== text.length) return esc(text);
    const marks = new Array(text.length).fill(false);
    tk.forEach(t => { let i = n.indexOf(t); while (i !== -1) { for (let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + t.length); } });
    let out = '', open = false;
    for (let k = 0; k < text.length; k++) {
        if (marks[k] && !open) { out += '<mark>'; open = true; }
        if (!marks[k] && open) { out += '</mark>'; open = false; }
        out += esc(text[k]);
    }
    return out + (open ? '</mark>' : '');
}
function fmtData(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR', { timeZone: 'America/Manaus' });
}
function labelAndares(p) {
    const bloco = p.divisoes.some(d => /bloco/i.test(d.nome));
    return plural(p.divisoes.length, bloco ? 'bloco' : 'andar', bloco ? 'blocos' : 'andares');
}
const totalSalas = p => p.divisoes.reduce((a, d) => a + d.unidades.length, 0);

// ============================================================
// DADOS (somente leitura — data/maptec.json no repositório)
// ============================================================
let DATA = null;
let INDEX = [];
let state = { offline: false, updatedAt: localStorage.getItem(CACHE_DATE) || '' };

async function loadData() {
    try {
        const r = await fetch(DATA_URL, { cache: 'no-cache' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const fromSW = r.headers.get('X-MapTec-Cache') === '1';
        DATA = await r.json();
        if (!fromSW) localStorage.setItem(CACHE_DATA, JSON.stringify(DATA));
        state.offline = fromSW;
        const lm = r.headers.get('last-modified');
        if (!state.updatedAt && lm) state.updatedAt = new Date(lm).toISOString();
    } catch (e) {
        const c = localStorage.getItem(CACHE_DATA);
        if (c) { DATA = JSON.parse(c); state.offline = true; }
    }
    if (!DATA) return false;
    buildIndex();
    return true;
}
function buildIndex() {
    INDEX = [];
    DATA.predios.forEach(p => p.divisoes.forEach(d => d.unidades.forEach((u, i) => {
        INDEX.push({
            p, d, u, aslug: slugify(d.nome),
            hay: norm([u.nome, u.sala ? 'sala ' + u.sala + ' ' + semZeros(u.sala) : '', u.codigo, u.obs, d.nome, p.nome, p.nomeCurto, p.subtitulo, p.endereco.bairro].join(' '))
        });
    })));
}
// A data vem do último commit REAL do arquivo de dados (API pública do GitHub).
async function loadUpdatedAt() {
    try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(DATA_URL)}&per_page=1`);
        if (!r.ok) return;
        const j = await r.json();
        const iso = j && j[0] && j[0].commit && j[0].commit.committer && j[0].commit.committer.date;
        if (iso) { state.updatedAt = iso; localStorage.setItem(CACHE_DATE, iso); renderFooter(); renderBanner(); }
    } catch (e) { /* mantém a data em cache */ }
}

const $ = id => document.getElementById(id);
function renderFooter() {
    const d = state.updatedAt ? fmtData(state.updatedAt) : '';
    $('footer').innerHTML = `

        <span>Ferramenta de consulta de salas, setores e unidades do Tribunal de Justiça do Estado de Roraima.</span>

}
function renderBanner() {
    const d = state.updatedAt ? fmtData(state.updatedAt) : '';
    $('banner').innerHTML = state.offline
        ? `<div class="banner" role="status"><div class="container">${ico('wifi', 18)}<span>Sem conexão: exibindo os dados salvos neste aparelho${d ? ' (base de ' + d + ')' : ''}. Podem estar desatualizados.</span></div></div>`
        : '';
}
function renderTopActions(isHome) {
    $('topActions').innerHTML = (isHome ? '' : `<a class="top-btn" href="#/">${ico('home')}<span>Início</span></a>`)
        + `<button class="top-btn" id="aboutBtn" type="button">${ico('info')}<span>Sobre o sistema</span></button>`;

function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// HOME
// ============================================================
let homeQuery = '';
function renderHome() {
    document.title = 'MapTec · TJRR';
    renderTopActions(true);
    const hero = DATA.predios[0] ? DATA.predios[0].foto : '';
    $('app').innerHTML = `
        <section class="hero" style="--hero-img:url('${esc(hero)}')">
            <div class="container">
                <h1>Encontre salas, setores e unidades do TJRR</h1>

                </form>
            </div>
        </section>

    input.addEventListener('input', () => { homeQuery = input.value; renderHomeBody(); });
    $('homeForm').addEventListener('submit', e => { e.preventDefault(); input.blur(); const f = document.querySelector('.res'); if (f) f.focus(); });
    renderHomeBody();
}
function searchAll(q) {
    const t = tokens(q), nq = t.filter(x => x !== 'sala').join(' ');
    const res = [];
    INDEX.forEach((r, i) => {
        if (!t.every(x => r.hay.includes(x))) return;
        let s = 0;
        if (r.u.sala && semZeros(norm(r.u.sala)) === nq) s += 100;
        if (r.u.codigo && norm(r.u.codigo) === nq) s += 90;
        if (nq && norm(r.u.nome).startsWith(nq)) s += 20;
        res.push({ r, s, i });
    });
    res.sort((a, b) => b.s - a.s || a.i - b.i);
    return res.map(x => x.r);
}
function renderHomeBody() {
    const q = homeQuery.trim(), box = $('homeBody');
    if (!q) {
        box.innerHTML = `<h2 class="section-title">${ico('building', 22)} Prédios do Tribunal</h2>
            <div class="building-grid">${DATA.predios.map((p, i) => `
                <a class="b-card" href="#/predio/${esc(p.id)}" style="animation-delay:${i * 50}ms">
                    <img src="${esc(p.foto)}" alt="Fachada do ${esc(p.nomeCurto || p.nome)}" loading="lazy" width="480" height="270">
                    <div class="b-body">
                        <h3 class="b-name">${esc(p.nomeCurto || p.nome)}</h3>
                        <div class="b-meta">${ico('pin', 15)} ${esc(p.endereco.bairro)}</div>
                        <div class="b-meta">${ico('building', 15)} ${labelAndares(p)} · ${plural(totalSalas(p), 'sala', 'salas')}</div>
                        <span class="b-go" aria-hidden="true">${ico('arrow', 18)}</span>
                    </div>
                </a>`).join('')}</div>`;
        return;
    }
    const res = searchAll(q), MAX = 80;
    if (!res.length) {
        box.innerHTML = `<div class="empty" role="status"><strong>Nada encontrado para "${esc(q)}"</strong>Confira a grafia ou tente só parte do nome, o número da sala.</div>`;
        return;
    }
    box.innerHTML = `<div class="res-count" role="status" aria-live="polite">${plural(res.length, 'resultado', 'resultados')}${res.length > MAX ? ` — mostrando os ${MAX} primeiros; refine a busca` : ''}</div>
        <div class="res-list">${res.slice(0, MAX).map(r => `
            <a class="res${r.u.sala ? '' : ' no-num'}" href="#/predio/${esc(r.p.id)}/${r.aslug}/${esc(r.u.id)}">
                ${r.u.sala ? `<span class="res-num">${esc(r.u.sala)}</span>` : ''}
                <span><div class="res-name">${r.u.nome ? highlight(fmtNome(r.u.nome), q) : '<em>Sem nome cadastrado</em>'}</div>
                <div class="res-loc">${esc(r.p.nomeCurto || r.p.nome)} · ${esc(r.d.nome)}</div></span>
                ${r.u.codigo ? `<span class="res-code">${ico('phone', 14)} ${highlight(r.u.codigo, q)}</span>` : ''}
            </a>`).join('')}</div>`;
}

// ============================================================
// PRÉDIO
// ============================================================
let viewMode = localStorage.getItem('maptec_view') || 'grid';
let buildingQuery = '';
let curBuilding = null;

const mapsUrl = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.endereco.logradouro, p.endereco.bairro, p.endereco.cidade, p.endereco.cep].filter(Boolean).join(', '));

function renderBuilding(p, aslug) {
    const andar = p.divisoes.find(d => slugify(d.nome) === aslug) || p.divisoes[0];
    document.title = (p.nomeCurto || p.nome) + ' · MapTec';
    renderTopActions(false);
    const e = p.endereco;
    const bloco = p.divisoes.some(d => /bloco/i.test(d.nome));
    $('app').innerHTML = `<div class="container">
        <nav class="crumbs" aria-label="Você está em"><a href="#/">Início</a>${ico('chevron', 14)}<span aria-current="page">${esc(p.nomeCurto || p.nome)}</span></nav>
        <div class="layout">
            <aside class="side">
                <img src="${esc(p.foto)}" alt="Fachada do ${esc(p.nomeCurto || p.nome)}" width="480" height="270">
                <div class="side-body">
                    <h1>${esc(p.nomeCurto || p.nome)}</h1>
                    ${p.subtitulo ? `<div class="sub">${esc(p.subtitulo)}</div>` : ''}
                    <div class="addr">${ico('pin', 18)}<div>${esc(e.logradouro)}<br>${esc(e.bairro)}${e.cidade ? ' · ' + esc(e.cidade) : ''}${e.cep ? '<br>CEP ' + esc(e.cep) : ''}</div></div>
                    <a class="btn btn-soft" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener noreferrer">${ico('pin', 18)} Abrir no Google Maps</a>
                    <p class="side-count">${plural(totalSalas(p), 'sala cadastrada', 'salas cadastradas')}</p>
                    <h2 class="floors-title">${bloco ? 'Blocos' : 'Andares'}</h2>
                    <nav class="floors" aria-label="${bloco ? 'Blocos' : 'Andares'}">${p.divisoes.map(d => {
                        const s = slugify(d.nome);
                        return `<a class="floor" href="#/predio/${esc(p.id)}/${s}" ${d === andar ? 'aria-current="true"' : ''}>${ico('layers', 16)}${esc(d.nome)}<span class="n">${d.unidades.length}</span></a>`;
                    }).join('')}</nav>
                </div>
            </aside>
            <section class="panel" aria-labelledby="floorTitle">
                <div class="panel-head"><span class="ico-wrap">${ico('layers', 30)}</span><div><h2 id="floorTitle">${esc(andar.nome)}</h2><p id="floorSub"></p></div></div>
                <div class="tools">
                    <label class="field">${ico('search', 20)}<span class="sr">Buscar neste prédio</span><input id="bq" type="search" placeholder="Buscar por número ou setor…" autocomplete="off" value="${esc(buildingQuery)}"></label>
                    <div class="view-toggle" role="group" aria-label="Modo de exibição">
                        <button type="button" id="vGrid" aria-label="Grade" aria-pressed="${viewMode === 'grid'}">${ico('grid')}</button>
                        <button type="button" id="vList" aria-label="Lista" aria-pressed="${viewMode === 'list'}">${ico('list')}</button>
                    </div>
                </div>
                <div id="roomsBox"></div>
            </section>
        </div></div>`;
    const draw = () => drawRooms(p, andar);
    $('bq').addEventListener('input', () => { buildingQuery = $('bq').value; draw(); });
    $('vGrid').addEventListener('click', () => setView('grid', draw));
    $('vList').addEventListener('click', () => setView('list', draw));
    draw();
}
function setView(m, draw) {
    viewMode = m; localStorage.setItem('maptec_view', m);
    $('vGrid').setAttribute('aria-pressed', m === 'grid'); $('vList').setAttribute('aria-pressed', m === 'list');
    draw();
}
function drawRooms(p, andar) {
    const q = buildingQuery.trim();
    let items;
    if (q) items = INDEX.filter(r => r.p === p && matches(r.hay, q));
    else items = andar.unidades.map(u => ({ p, d: andar, u, aslug: slugify(andar.nome) }));
    $('floorSub').textContent = q
        ? `${plural(items.length, 'resultado', 'resultados')} em todo o prédio`
        : 'Selecione uma sala para ver mais informações';
    if (!items.length) {
        $('roomsBox').innerHTML = `<div class="empty" role="status"><strong>Nenhuma sala encontrada</strong>Confira a grafia ou tente só parte do nome, o número da sala.</div>`;
        return;
    }
    $('roomsBox').innerHTML = `<div class="rooms ${viewMode}">${items.map((r, i) => `
        <a class="room" href="#/predio/${esc(p.id)}/${r.aslug}/${esc(r.u.id)}" style="animation-delay:${Math.min(i, 20) * 15}ms">
            ${r.u.sala ? `<span class="room-num">${highlight(r.u.sala, q)}</span>` : ''}
            <span class="room-name">${r.u.nome ? highlight(fmtNome(r.u.nome), q) : '<em>Sem nome cadastrado</em>'}</span>
            ${q ? `<span class="room-floor">${esc(r.d.nome)}</span>` : ''}
            ${r.u.codigo ? `<span class="room-code">${ico('phone', 13)} ${highlight(r.u.codigo, q)}</span>` : ''}
        </a>`).join('')}</div>`;
}

// ============================================================
// MODAIS
// ============================================================
let lastFocus = null;
function showModal(html, onClose) {
    lastFocus = document.activeElement;
    $('modalRoot').innerHTML = `<div class="overlay" id="overlay">${html}</div>`;
    const ov = $('overlay');
    ov.addEventListener('click', e => { if (e.target === ov) onClose(); });
    ov.querySelector('.modal-x').addEventListener('click', onClose);
    ov.querySelector('.modal-x').focus();
    document.body.style.overflow = 'hidden';
}
function hideModal() {
    $('modalRoot').innerHTML = '';
    document.body.style.overflow = '';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
}
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('overlay')) { e.preventDefault(); $('overlay').querySelector('.modal-x').click(); }
});

function openRoom(p, aslug, u) {
    const andar = p.divisoes.find(d => slugify(d.nome) === aslug) || p.divisoes[0];
    const base = `#/predio/${p.id}/${aslug}`;
    const sug = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent('Correção: ' + (u.sala ? 'sala ' + u.sala : fmtNome(u.nome)) + ' — ' + (p.nomeCurto || p.nome))}&body=${encodeURIComponent(`Prédio: ${p.nome}\nAndar/bloco: ${andar.nome}\nSala: ${u.sala || 's/n'}\nSetor/unidade: ${u.nome}\nCódigo atual: ${u.codigo || '—'}\n\nO que está incorreto ou faltando?\n`)}`;
    showModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <button class="modal-x" type="button" aria-label="Fechar">${ico('x', 24)}</button>
        <div class="m-head"><span class="m-badge">${ico('door', 32)}</span><h2 id="mTitle">${u.sala ? 'Sala ' + esc(u.sala) : esc(fmtNome(u.nome) || 'Sala sem número')}</h2></div>
        <div class="m-row">${ico('building', 22)}<span>${esc(p.nomeCurto || p.nome)}</span></div>
        <div class="m-row">${ico('layers', 22)}<span>${esc(andar.nome)}</span></div>
        ${u.nome ? `<div class="m-row">${ico('door', 22)}<span>${esc(fmtNome(u.nome))}</span></div>` : ''}
        ${u.codigo ? `<div class="m-code"><strong>${ico('phone', 26)} ${esc(u.codigo)}</strong><button class="btn btn-primary" type="button" id="copyBtn" aria-label="Copiar ${esc(u.codigo)}">${ico('copy', 18)} Copiar</button></div>` : ''}
        ${u.obs ? `<div class="m-obs">${ico('info', 20)}<span>${esc(u.obs)}</span></div>` : ''}
        <div class="m-actions">
            <a class="btn btn-soft" href="${esc(sug)}" target="_blank" rel="noopener noreferrer">${ico('edit', 18)} Sugerir correção</a>
            <a class="btn btn-primary" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener noreferrer">${ico('pin', 18)} Ver prédio no Google Maps</a>
        </div>
    </div>`, () => { location.hash = base; });
    const cb = $('copyBtn');
    if (cb) cb.addEventListener('click', () => copiar(u.codigo));
}
function copiar(cod) {
    const ok = () => toast(cod + ' copiado.');
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(cod).then(ok, () => toast('Não foi possível copiar.'));
    } else {
        const ta = document.createElement('textarea'); ta.value = cod; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) { toast('Não foi possível copiar.'); }
        ta.remove();
    }
}
function openAbout() {
    const it = (i, t, d) => `<div class="about-item"><span class="circ">${ico(i, 22)}</span><div><strong>${t}</strong><span>${d}</span></div></div>`;
    showModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="aTitle">
        <button class="modal-x" type="button" aria-label="Fechar">${ico('x', 24)}</button>
        <h2 id="aTitle" style="margin:0 40px 6px 0;color:var(--navy)">MapTec · TJRR</h2>
        <p style="margin:0;color:var(--muted)">Consulta rápida de salas, setores e unidades dos prédios do Tribunal de Justiça do Estado de Roraima.</p>
        <div class="about-list">
            ${it('search', 'Busca rápida', 'Encontre por número da sala, setor, unidade ou prédio.')}
            ${it('building', 'Navegação simples', 'Escolha o prédio e o andar para ver todas as salas.')}
            ${it('edit', 'Correções', 'Encontrou algo errado? Use "Sugerir correção" na sala.')}
            ${it('check', 'Funciona sem internet', 'Os últimos dados consultados ficam salvos no aparelho.')}
        </div>
    </div>`, hideModal);
}

// ============================================================
// ROTAS
// ============================================================
let rendered = '';
function route() {
    if (!DATA) return;
    const m = location.hash.match(/^#\/predio\/([^\/]+)(?:\/([^\/]+))?(?:\/([^\/]+))?/);
    if (!m) {
        hideModalIf();
        if (rendered !== 'home') { rendered = 'home'; renderHome(); window.scrollTo(0, 0); }
        return;
    }
    const p = DATA.predios.find(x => x.id === m[1]);
    if (!p) { location.hash = '#/'; return; }
    const aslug = m[2] || slugify(p.divisoes[0].nome);
    const key = 'b:' + p.id + ':' + aslug;
    if (rendered !== key) {
        if (!rendered.startsWith('b:' + p.id + ':')) buildingQuery = '';
        rendered = key; renderBuilding(p, aslug);
        if (!m[3]) window.scrollTo(0, 0);
    }
    if (m[3]) {
        const u = p.divisoes.flatMap(d => d.unidades).find(x => x.id === m[3]);
        if (u) openRoom(p, aslug, u); else location.hash = `#/predio/${p.id}/${aslug}`;
    } else hideModalIf();
}
function hideModalIf() { if ($('overlay')) hideModal(); }
window.addEventListener('hashchange', route);

// ============================================================
// INIT
// ============================================================
(async function init() {
    renderFooter();
    const ok = await loadData();
    if (!ok) {
        $('app').innerHTML = `<div class="container"><div class="empty" role="alert"><strong>Não foi possível carregar os dados</strong>Verifique sua conexão e tente novamente.<br><br><button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button></div></div>`;
        return;
    }
    renderBanner(); renderFooter();
    route();
    loadUpdatedAt();
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
